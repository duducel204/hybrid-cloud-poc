name: CPU remoto sintético
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Calcular soma de quadrados
        shell: bash
        run: |
          python - <<'PY'
          import json, platform, socket, time
          inicio = time.perf_counter()
          resultado = sum(i * i for i in range(1_000_000))
          dados = {'resultado': resultado, 'tempo_calculo_s': round(time.perf_counter() - inicio, 4), 'ambiente': platform.platform(), 'hostname': socket.gethostname(), 'executor': 'github-actions'}
          texto = json.dumps(dados, ensure_ascii=False)
          print(texto)
          print('::notice title=Resultado remoto::' + texto)
          PY
