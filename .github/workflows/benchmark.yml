name: Benchmark sintético
on:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Medir CPU, RAM e arquivo temporário
        shell: bash
        run: |
          python - <<'PY'
          import json, os, platform, socket, tempfile, time, tracemalloc
          def medir(nome, f):
              tracemalloc.start(); inicio=time.perf_counter(); detalhe=f(); tempo=time.perf_counter()-inicio
              _,pico=tracemalloc.get_traced_memory(); tracemalloc.stop()
              return {'nome':nome,'tempo_s':round(tempo,4),'pico_tracemalloc_mb':round(pico/1048576,2),'detalhe':detalhe}
          def cpu(): return {'checksum':sum((i*i)%1000003 for i in range(5000000))}
          def ram():
              d=bytearray(64*1048576)
              for i in range(0,len(d),4096): d[i]=i%251
              return {'bytes_alocados':len(d),'checksum':sum(d[::4096])}
          def arquivo():
              tamanho=16*1048576; bloco=b'0123456789abcdef'*4096
              with tempfile.NamedTemporaryFile(delete=False) as f:
                  caminho=f.name
                  for _ in range(tamanho//len(bloco)): f.write(bloco)
              try:
                  with open(caminho,'rb') as f: soma=sum(f.read())
                  return {'bytes_processados':tamanho,'checksum':soma}
              finally: os.unlink(caminho)
          dados={'ambiente':platform.platform(),'hostname':socket.gethostname(),'origem_dados':'sinteticos_gerados_no_executor','dados_transferidos_do_windows_bytes':0,'testes':[medir('cpu_bound',cpu),medir('ram_bound',ram),medir('arquivo_sintetico',arquivo)]}
          texto=json.dumps(dados,ensure_ascii=False); print(texto); print('::notice title=Benchmark remoto::'+texto)
          PY
